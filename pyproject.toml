[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "defusion-mtech"
version = "0.1.0"
description = "An educational self-supervised common/unique decomposition project for image fusion"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [
  { name = "M.Tech Project Student" }
]
keywords = ["image-fusion", "self-supervised-learning", "pytorch", "streamlit", "computer-vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "opencv-python-headless>=4.9,<5",
  "PyWavelets>=1.6,<2",
  "scikit-image>=0.23,<1",
  "streamlit>=1.38,<2",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
defusion-fuse = "defusion_mtech.cli:main"
defusion-train = "defusion_mtech.train:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
